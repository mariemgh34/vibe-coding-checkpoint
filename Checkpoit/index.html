<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariem Ghourabi | Full Stack Developer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #fff1f2 100%);
      overflow-x: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
    }

    .blob-pink {
      width: 280px;
      height: 280px;
      background: #f472b6;
      top: 15%;
      left: -60px;
    }

    .blob-purple {
      width: 320px;
      height: 320px;
      background: #c084fc;
      bottom: 12%;
      right: -80px;
    }

    .hero-card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      max-width: 700px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(226, 232, 240, 0.8);
      color: #6b7280;
      font-size: 0.95rem;
      font-weight: 500;
      backdrop-filter: blur(6px);
      margin-bottom: 1.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f472b6;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 1rem;
    }

    .name-gradient {
      background: linear-gradient(90deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.5rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 1rem;
    }

    .description {
      font-size: 1.1rem;
      color: #6b7280;
      line-height: 1.7;
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }

    .btn-projects {
      background: linear-gradient(90deg, #c084fc, #f472b6);
      color: white;
      border: none;
      padding: 0.85rem 2.2rem;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(192, 132, 252, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-projects:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(244, 114, 182, 0.4);
      color: white;
    }

    .decorative-dots {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
    }

    .decorative-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c084fc;
      opacity: 0.6;
    }

    .decorative-dots span:nth-child(2) {
      background: #f472b6;
    }

    @media (max-width: 576px) {
      h1 { font-size: 2.5rem; }
      .subtitle { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="blob blob-pink" aria-hidden="true"></div>
  <div class="blob blob-purple" aria-hidden="true"></div>

  <main class="hero-card">
    <div class="badge-pill">
      <span class="dot"></span>
      Welcome to my portfolio
    </div>

    <h1>
      Mariem <span class="name-gradient">Ghourabi</span>
    </h1>

    <p class="subtitle">Full stack Developer</p>

    <p class="description">
      I craft elegant, user-focused web applications with modern technologies and attention to detail.
    </p>

    <a href="#projects" class="btn btn-projects">View My Projects</a>

    <div class="decorative-dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
